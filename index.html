<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF Band Conditions</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --green: #15803d;
      --green-bg: #dcfce7;
      --green-border: #86efac;
      --yellow: #b45309;
      --yellow-bg: #fef3c7;
      --yellow-border: #fde68a;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --red-border: #fca5a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 440px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.3px; }
    .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 6px rgba(22, 163, 74, 0.4); }

    .grid-indices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 12px; }
    .card-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 2px; font-weight: 600; }
    .card-value { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }
    .card-sub { font-size: 0.72rem; margin-top: 2px; font-weight: 500; }

    .table-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 12px; overflow: hidden; }
    .table-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; }
    th { color: var(--text-muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--card-border); }
    td { padding: 5px 8px; border-bottom: 1px solid #f1f5f9; }
    tr:last-child td { border-bottom: none; }

    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .pill-good { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .pill-fair { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .pill-poor { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

    .updated-text { text-align: center; margin-top: 10px; font-size: 0.68rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Band Conditions</h1>
    <div class="live-indicator">
      <div class="dot"></div>
      <span>NOAA Live</span>
    </div>
  </div>

  <div class="grid-indices">
    <div class="card">
      <div class="card-title">Solar Flux (SFI)</div>
      <div class="card-value" id="sfi-val">--</div>
      <div class="card-sub" id="sfi-sub">Loading...</div>
    </div>
    <div class="card">
      <div class="card-title">Planetary K-Index</div>
      <div class="card-value" id="k-val">--</div>
      <div class="card-sub" id="k-sub">Loading...</div>
    </div>
    <div class="card">
      <div class="card-title">A-Index</div>
      <div class="card-value" id="a-val">--</div>
      <div class="card-sub" id="a-sub">Loading...</div>
    </div>
    <div class="card">
      <div class="card-title">Geomagnetic Field</div>
      <div class="card-value" id="geo-val" style="font-size: 1.05rem; line-height: 1.35rem;">--</div>
      <div class="card-sub" id="geo-sub">Loading...</div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-title">HF Propagation Status</div>
    <table>
      <thead>
        <tr>
          <th>Band</th>
          <th>Day</th>
          <th>Night</th>
        </tr>
      </thead>
      <tbody>
        <tr><td style="font-weight:600; color:var(--text-main);">80m-40m</td><td><span id="p-80m-d" class="pill pill-fair">Fair</span></td><td><span id="p-80m-n" class="pill pill-good">Good</span></td></tr>
        <tr><td style="font-weight:600; color:var(--text-main);">30m-20m</td><td><span id="p-30m-d" class="pill pill-good">Good</span></td><td><span id="p-30m-n" class="pill pill-good">Good</span></td></tr>
        <tr><td style="font-weight:600; color:var(--text-main);">17m-15m</td><td><span id="p-17m-d" class="pill pill-good">Good</span></td><td><span id="p-17m-n" class="pill pill-poor">Poor</span></td></tr>
        <tr><td style="font-weight:600; color:var(--text-main);">12m-10m</td><td><span id="p-10m-d" class="pill pill-fair">Fair</span></td><td><span id="p-10m-n" class="pill pill-poor">Poor</span></td></tr>
      </tbody>
    </table>
  </div>

  <div class="updated-text" id="last-updated">Connecting to NOAA / N0NBH...</div>
</div>

<script>
  function setPill(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    const rating = (text || 'fair').toLowerCase();
    el.className = `pill pill-${rating}`;
    el.innerText = rating.charAt(0).toUpperCase() + rating.slice(1);
  }

  // JSONP callback function that N0NBH script calls automatically
  window.hamqsl_callback = function(data) {
    try {
      const sfi = parseInt(data.solarflux) || 140;
      const k = parseFloat(data.kindex) || 2.0;
      const a = parseInt(data.aindex) || 5;
      const geo = data.geomagfield || 'Quiet';

      document.getElementById('sfi-val').innerText = sfi;
      document.getElementById('sfi-sub').innerHTML = sfi >= 130 
        ? '<span style="color:var(--green)">High Ionization</span>' 
        : (sfi >= 90 ? '<span style="color:var(--yellow)">Moderate</span>' : '<span style="color:var(--red)">Low</span>');

      document.getElementById('k-val').innerText = k.toFixed(1);
      document.getElementById('k-val').style.color = k >= 4 ? 'var(--red)' : (k >= 3 ? 'var(--yellow)' : 'var(--green)');
      document.getElementById('k-sub').innerText = k <= 2 ? 'Calm Geomagnetic' : (k <= 4 ? 'Unsettled' : 'Storm Alert');

      document.getElementById('a-val').innerText = a;
      document.getElementById('a-sub').innerText = a < 10 ? 'Low Absorption' : 'High Absorption';

      document.getElementById('geo-val').innerText = geo;
      document.getElementById('geo-val').style.color = (geo.toLowerCase().includes('storm') || k >= 5) ? 'var(--red)' : (k >= 3 ? 'var(--yellow)' : 'var(--green)');
      document.getElementById('geo-sub').innerText = `Kp = ${k.toFixed(1)}`;

      if (data.calculatedconditions && data.calculatedconditions.band) {
        data.calculatedconditions.band.forEach(b => {
          if (b.name === '80m-40m') { setPill('p-80m-d', b.day); setPill('p-80m-n', b.night); }
          if (b.name === '30m-20m') { setPill('p-30m-d', b.day); setPill('p-30m-n', b.night); }
          if (b.name === '17m-15m') { setPill('p-17m-d', b.day); setPill('p-17m-n', b.night); }
          if (b.name === '12m-10m') { setPill('p-10m-d', b.day); setPill('p-10m-n', b.night); }
        });
      }

      document.getElementById('last-updated').innerText = `Updated: ${data.updated || new Date().toUTCString().slice(17, 22) + ' UTC'}`;
    } catch(err) {
      console.error(err);
    }
  };

  // Load via JSONP script tag (bypasses all iframe security/CORS restrictions)
  const script = document.createElement('script');
  script.src = 'https://www.hamqsl.com/solarjson.php?callback=hamqsl_callback';
  document.body.appendChild(script);
</script>

</body>
</html>
